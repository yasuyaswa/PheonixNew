<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Phoenix Age Calculator – find your exact age in years, months, days, hours, minutes and seconds."/>
  <meta name="theme-color" content="#f59e0b"/>
  <title>Age Calculator — Phoenix</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../styles/main.css"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="../styles/glass.css"/>
</head>
<body data-app="age">

<!-- Phoenix Navigation -->
<nav class="phoenix-nav" aria-label="Site navigation">
  <a href="../index.html" class="nav-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Dashboard
  </a>
  <a href="../index.html" class="nav-brand" aria-label="Phoenix Dashboard">
    <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="npg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc23c"/><stop offset="0.45" stop-color="#ff7a18"/><stop offset="1" stop-color="#e11d2f"/></linearGradient></defs><g fill="url(#npg1)"><path d="M256 232 C 300 196 332 182 356 150 C 372 128 384 104 392 78 C 396 112 392 140 378 166 C 404 150 424 124 436 96 C 436 134 420 166 392 190 C 420 184 446 168 466 144 C 456 188 424 220 380 236 C 340 250 296 250 256 244 Z"/><path d="M256 232 C 212 196 180 182 156 150 C 140 128 128 104 120 78 C 116 112 120 140 134 166 C 108 150 88 124 76 96 C 76 134 92 166 120 190 C 92 184 66 168 46 144 C 56 188 88 220 132 236 C 172 250 216 250 256 244 Z"/><path d="M256 150 C 240 156 231 170 236 186 C 224 180 210 186 210 200 C 222 194 232 198 238 208 C 226 214 224 230 234 240 C 240 226 250 222 256 232 C 262 222 272 226 278 240 C 288 230 286 214 274 208 C 280 198 290 194 302 200 C 302 186 288 180 276 186 C 281 170 272 156 256 150 Z"/><path d="M256 242 C 238 276 236 312 252 346 C 236 342 224 320 222 296 C 210 328 218 372 246 404 C 240 372 246 350 258 336 C 262 358 258 388 240 420 C 276 402 292 360 282 320 C 300 346 300 392 280 430 C 318 408 334 356 320 310 C 336 330 338 372 322 408 C 356 378 360 320 338 278 C 320 258 288 244 256 242 Z"/></g></svg>
    <span>Phoenix</span>
  </a>
</nav>

<!-- Animated background orbs (CSS only – GitHub Pages safe) -->
<div class="bg-orbs" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<div class="wrapper">
  <div class="card" id="capture">

    <!-- Header -->
    <div class="card-header">
      <div class="header-icon">🎂</div>
      <h1>Age Calculator</h1>
      <p class="subtitle">Discover your exact age to the second</p>
    </div>

    <!-- Inputs -->
    <div class="form-section">
      <div class="input-group">
        <span class="input-icon">👤</span>
        <input type="text" id="name" placeholder="Your name (optional)" autocomplete="off" />
      </div>

      <div class="input-group">
        <span class="input-icon">📅</span>
        <input type="datetime-local" id="dob" aria-label="Date and time of birth" />
      </div>

      <button class="primary-btn" onclick="start()" aria-label="Calculate age">
        <span>Calculate My Age</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>

    <!-- Result section -->
    <div class="result-section hidden" id="resultSection">

      <div class="divider"></div>

      <!-- Name greeting -->
      <div class="name-display hidden" id="nameDisplay"></div>

      <!-- Birthday Highlight -->
      <div class="bday-highlight" id="bdayHighlight">
        <div class="bday-highlight-days" id="bdayHighlightDays">—</div>
        <div class="bday-highlight-label" id="bdayHighlightLabel">days until your birthday</div>
        <div class="bday-highlight-date" id="bdayHighlightDate"></div>
      </div>

      <!-- Zodiac + born-day chips -->
      <div class="fun-row" id="funRow">
        <div class="fun-chip" id="zodiacChip"></div>
        <div class="fun-chip" id="bornDayChip"></div>
      </div>

      <!-- Age tiles: Years spans 2 cols -->
      <div class="tiles" id="tiles">
        <div class="tile tile-years">
          <div class="tile-value" id="years">0</div>
          <div class="tile-label">Years</div>
        </div>
        <div class="tile tile-months">
          <div class="tile-value" id="months">0</div>
          <div class="tile-label">Months</div>
        </div>
        <div class="tile tile-days">
          <div class="tile-value" id="days">0</div>
          <div class="tile-label">Days</div>
        </div>
        <div class="tile tile-hours">
          <div class="tile-value" id="hours">0</div>
          <div class="tile-label">Hours</div>
        </div>
        <div class="tile tile-minutes">
          <div class="tile-value" id="minutes">0</div>
          <div class="tile-label">Minutes</div>
        </div>
        <div class="tile tile-seconds">
          <div class="tile-value" id="seconds">0</div>
          <div class="tile-label">Seconds</div>
        </div>
      </div>

      <!-- Total days banner -->
      <div class="total-days" id="totalDays"></div>

      <!-- Next birthday card -->
      <div class="birthday-card" id="birthday">
        <div class="birthday-header">
          <span>🎉</span>
          <span class="birthday-label">Next Birthday</span>
        </div>
        <div class="birthday-time" id="nextBirthday"></div>
        <div class="progress-track">
          <div class="progress-bar" id="birthdayProgress"></div>
        </div>
        <div class="progress-label" id="progressLabel"></div>
      </div>

    </div>
  </div>

  <!-- Export button (outside card so it doesn't appear in the export) -->
  <button class="export-btn hidden" id="exportBtn" onclick="exportImage()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Export as Image
  </button>

  <footer class="site-footer">Built with <span class="heart">&#9829;</span> for GitHub Pages</footer>
</div>

<!-- Confetti canvas (shown only on birthday) -->
<canvas id="confettiCanvas" aria-hidden="true"></canvas>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
