<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Phoenix Interest Calculator – compute simple &amp; compound returns instantly."/>
  <meta name="theme-color" content="#10b981"/>
  <title>Interest Calculator — Phoenix</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css"/>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../styles/glass.css">
</head>
<body data-app="interest">

<!-- Phoenix Navigation -->
<nav class="phoenix-nav" aria-label="Site navigation">

    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Dashboard
  </a>
  <a href="../index.html" class="nav-brand" aria-label="Phoenix Dashboard">
    <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="npg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc23c"/><stop offset="0.45" stop-color="#ff7a18"/><stop offset="1" stop-color="#e11d2f"/></linearGradient></defs><g fill="url(#npg2)"><path d="M256 232 C 300 196 332 182 356 150 C 372 128 384 104 392 78 C 396 112 392 140 378 166 C 404 150 424 124 436 96 C 436 134 420 166 392 190 C 420 184 446 168 466 144 C 456 188 424 220 380 236 C 340 250 296 250 256 244 Z"/><path d="M256 232 C 212 196 180 182 156 150 C 140 128 128 104 120 78 C 116 112 120 140 134 166 C 108 150 88 124 76 96 C 76 134 92 166 120 190 C 92 184 66 168 46 144 C 56 188 88 220 132 236 C 172 250 216 250 256 244 Z"/><path d="M256 150 C 240 156 231 170 236 186 C 224 180 210 186 210 200 C 222 194 232 198 238 208 C 226 214 224 230 234 240 C 240 226 250 222 256 232 C 262 222 272 226 278 240 C 288 230 286 214 274 208 C 280 198 290 194 302 200 C 302 186 288 180 276 186 C 281 170 272 156 256 150 Z"/><path d="M256 242 C 238 276 236 312 252 346 C 236 342 224 320 222 296 C 210 328 218 372 246 404 C 240 372 246 350 258 336 C 262 358 258 388 240 420 C 276 402 292 360 282 320 C 300 346 300 392 280 430 C 318 408 334 356 320 310 C 336 330 338 372 322 408 C 356 378 360 320 338 278 C 320 258 288 244 256 242 Z"/></g></svg>
    <span>Phoenix</span>
  </a>
</nav>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="container">

  <div class="header">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-4H9l3-7 3 7h-2v4z" fill="currentColor"/>
      </svg>
    </div>
    <h1>Interest Calculator</h1>
    <p class="subtitle">Compute simple &amp; compound returns instantly</p>
  </div>

  <div class="toggle-pill">
    <div class="pill-track" id="pillTrack"></div>
    <button id="simpleBtn" class="pill-btn active">Simple</button>
    <button id="compoundBtn" class="pill-btn">Compound</button>
  </div>

  <div class="card">

    <div class="field-group">
      <label class="field-label" for="principal">
        <span class="field-label-dot blue-dot"></span>
        Principal Amount
      </label>
      <div class="field-wrap">
        <span class="field-adornment left">₹</span>
        <input type="text" id="principal" placeholder="0.00" autocomplete="off" inputmode="decimal">
      </div>
    </div>

    <div class="field-group">
      <label class="field-label" for="rate">
        <span class="field-label-dot green-dot"></span>
        Interest Rate
      </label>
      <div class="field-wrap">
        <input type="number" id="rate" step="0.01" min="0" placeholder="0.00">
        <span class="field-adornment right">% / mo</span>
      </div>
    </div>

    <div class="date-grid">
      <div class="field-group">
        <label class="field-label" for="startDate">
          <span class="field-label-dot purple-dot"></span>
          Start Date
        </label>
        <div class="field-wrap">
          <input type="date" id="startDate">
        </div>
      </div>
      <div class="field-group">
        <label class="field-label" for="endDate">
          <span class="field-label-dot orange-dot"></span>
          End Date
        </label>
        <div class="field-wrap">
          <input type="date" id="endDate">
        </div>
      </div>
    </div>

    <button class="calc-btn" id="calcBtn" onclick="calculate()">
      <span class="calc-btn-text">Calculate</span>
      <svg class="calc-btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

  </div>

  <div class="result hidden" id="resultBox">
    <p class="result-eyebrow">Results</p>
    <div class="result-chips">
      <div class="chip chip-blue">
        <span class="chip-label">Duration</span>
        <span class="chip-val" id="duration">—</span>
      </div>
      <div class="chip chip-cyan">
        <span class="chip-label">Interest</span>
        <span class="chip-val">₹<span id="interest">—</span></span>
      </div>
    </div>
    <div class="result-total-box">
      <span class="total-label">Total Amount</span>
      <span class="total-amount">₹<span id="total">—</span></span>
    </div>
    <button class="copy-btn" id="copyBtn" onclick="copyResult()">
      <svg id="copyIcon" width="15" height="15" viewBox="0 0 24 24" fill="none">
        <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span id="copyText">Copy Results</span>
    </button>
  </div>

  <footer class="footer">
    Built with <span class="heart">&#10084;</span> &middot; Hosted on <a href="https://pages.github.com" target="_blank" rel="noopener noreferrer">GitHub Pages</a>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
