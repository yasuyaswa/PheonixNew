<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SecureCode – Generate encrypted secret codes instantly from text and numbers." />
  <meta name="theme-color" content="#8b5cf6" />
  <title>SecureCode — Phoenix</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/main.css"/>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../styles/glass.css" />
</head>
<body data-app="secure">

  <!-- Phoenix Navigation -->
  <nav class="phoenix-nav" aria-label="Site navigation">
    <a href="../index.html" class="nav-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Dashboard
    </a>
    <a href="../index.html" class="nav-brand" aria-label="Phoenix Dashboard">
      <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="npg5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc23c"/><stop offset="0.45" stop-color="#ff7a18"/><stop offset="1" stop-color="#e11d2f"/></linearGradient></defs><g fill="url(#npg5)"><path d="M256 232 C 300 196 332 182 356 150 C 372 128 384 104 392 78 C 396 112 392 140 378 166 C 404 150 424 124 436 96 C 436 134 420 166 392 190 C 420 184 446 168 466 144 C 456 188 424 220 380 236 C 340 250 296 250 256 244 Z"/><path d="M256 232 C 212 196 180 182 156 150 C 140 128 128 104 120 78 C 116 112 120 140 134 166 C 108 150 88 124 76 96 C 76 134 92 166 120 190 C 92 184 66 168 46 144 C 56 188 88 220 132 236 C 172 250 216 250 256 244 Z"/><path d="M256 150 C 240 156 231 170 236 186 C 224 180 210 186 210 200 C 222 194 232 198 238 208 C 226 214 224 230 234 240 C 240 226 250 222 256 232 C 262 222 272 226 278 240 C 288 230 286 214 274 208 C 280 198 290 194 302 200 C 302 186 288 180 276 186 C 281 170 272 156 256 150 Z"/><path d="M256 242 C 238 276 236 312 252 346 C 236 342 224 320 222 296 C 210 328 218 372 246 404 C 240 372 246 350 258 336 C 262 358 258 388 240 420 C 276 402 292 360 282 320 C 300 346 300 392 280 430 C 318 408 334 356 320 310 C 336 330 338 372 322 408 C 356 378 360 320 338 278 C 320 258 288 244 256 242 Z"/></g></svg>
      <span>Phoenix</span>
    </a>
  </nav>

  <!-- Animated Orbs Background -->
  <div class="orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <!-- Main Content -->
  <main class="main">
    <div class="card">

      <!-- Header -->
      <header class="card-header">
        <div class="logo-ring" aria-hidden="true">🔐</div>
        <div>
          <h1 class="logo-title">Secure<span>Code</span></h1>
          <p class="logo-sub">Encrypt your text into a secret code</p>
        </div>
        <div class="header-tags" aria-hidden="true">
          <span class="tag">⚡ Instant</span>
          <span class="tag">🔒 Private</span>
        </div>
      </header>

      <div class="rule"></div>

      <!-- Form -->
      <form class="form" id="codeForm" onsubmit="return false;" novalidate autocomplete="off">

        <div class="field" id="field1">
          <div class="field-meta">
            <label for="code1">Full Name</label>
            <span class="field-badge" id="charCount" aria-live="polite">0 / ∞</span>
          </div>
          <div class="input-group">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6h16M4 10h16M4 14h10"/>
            </svg>
            <input type="text" id="code1" placeholder="e.g. Alfa Frika…" spellcheck="false" />
          </div>
        </div>

        <div class="field" id="field2">
          <div class="field-meta">
            <label for="code2">Mobile Last 2 Digits</label>
            <span class="field-badge">0 – 99</span>
          </div>
          <div class="input-group">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <path d="M8 12h8M12 8v8"/>
            </svg>
            <input type="number" id="code2" placeholder="Enter number…" min="0" max="100" />
          </div>
        </div>

        <p class="kbd-hint" aria-hidden="true">
          Hit <kbd>Enter</kbd> to generate &nbsp;·&nbsp; <kbd>Ctrl+Enter</kbd> anywhere
        </p>

        <div class="btn-row">
          <button type="button" id="processBtn" class="btn-generate" onclick="process()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            Generate Code
            <div class="btn-shimmer" aria-hidden="true"></div>
          </button>
          <button type="button" class="btn-reset" onclick="resetAll()">↺ Reset</button>
        </div>
      </form>

      <!-- Result -->
      <section class="result-section" id="result" hidden aria-live="polite" aria-atomic="true">
        <div class="result-card" id="resultCard">

          <div class="result-top">
            <div class="status-pill">
              <span id="statusIcon" aria-hidden="true"></span>
              <span id="statusText"></span>
            </div>
          </div>

          <div class="code-block">
            <div class="code-block-header">
              <span class="code-label">Secret Code</span>
              <div class="code-dots" aria-hidden="true">
                <span></span><span></span><span></span>
              </div>
            </div>
            <div class="code-display">
              <code id="output" aria-label="Generated secret code"></code>
            </div>
          </div>

          <button class="btn-copy" id="copyBtn" onclick="copy()" disabled aria-label="Copy code to clipboard">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span id="copyLabel">Copy to clipboard</span>
          </button>

        </div>
      </section>

    </div><!-- /card -->
  </main>

  <!-- Toast Notification -->
  <div class="toast" id="toast" role="status" aria-live="assertive"></div>

  <!-- Footer -->
  <footer class="footer">
    Built with <span class="footer-heart" aria-label="love">❤️</span> using
    <a href="https://pages.github.com" target="_blank" rel="noopener noreferrer">GitHub Pages</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
