<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Phoenix Percentage Calculator – calculate discounts, tax, and percentage values instantly."/>
  <meta name="theme-color" content="#6c47ff"/>
  <title>% Calculator — Phoenix</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../styles/main.css"/>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../styles/glass.css"/>
</head>
<body data-app="percent">

<!-- Phoenix Navigation -->
<nav class="phoenix-nav" aria-label="Site navigation">

    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Dashboard
  </a>
  <a href="../index.html" class="nav-brand" aria-label="Phoenix Dashboard">

    <span>Phoenix</span>
  </a>
</nav>

<div class="bg-orbs" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="app">
  <h1>🧮 % Calculator</h1>

  <!-- MODE TABS -->
  <div class="mode-tabs">
    <button class="mode-tab active" id="tabStandard" onclick="setCalcMode('standard')">Standard</button>
    <button class="mode-tab" id="tabReverse" onclick="setCalcMode('reverse')">Reverse %</button>
    <button class="mode-tab" id="tabTip" onclick="setCalcMode('tip')">Tip</button>
  </div>

  <!-- INPUTS -->
  <div id="inputStandard">
    <div class="input-group">
      <div class="field">
        <label>Amount</label>
        <input type="text" id="amount" inputmode="numeric" placeholder="Enter amount" />
      </div>
      <div class="field">
        <label>Percentage (%)</label>
        <input type="number" id="percentage" />
      </div>
    </div>
  </div>

  <div id="inputReverse" class="hidden">
    <p class="mode-hint">Find what percentage X is of Y</p>
    <div class="input-group">
      <div class="field">
        <label>Part (X)</label>
        <input type="text" id="partX" inputmode="numeric" placeholder="e.g. 25" />
      </div>
      <div class="field">
        <label>Total (Y)</label>
        <input type="text" id="totalY" inputmode="numeric" placeholder="e.g. 200" />
      </div>
    </div>
  </div>

  <div id="inputTip" class="hidden">
    <div class="input-group">
      <div class="field">
        <label>Bill Amount</label>
        <input type="text" id="billAmount" inputmode="numeric" placeholder="Enter bill" />
      </div>
      <div class="field">
        <label>Tip %</label>
        <input type="number" id="tipPercent" placeholder="e.g. 15" min="0" />
      </div>
    </div>
  </div>

  <!-- CALCULATE -->
  <button class="calc-btn" id="calcBtn">Calculate</button>

  <!-- RESULTS -->
  <div class="results hidden" id="resultsStandard">
    <div class="main-card copy" data-copy="percent">
      <p>Percentage Value</p>
      <h1 id="percentValue">₹0</h1>
      <span class="copied">Copied</span>
    </div>

    <div class="row">
      <div class="sub-card discount copy" data-copy="discount">
        <p>Discount Price</p>
        <h2 id="discountValue">₹0</h2>
        <span class="copied">Copied</span>
      </div>

      <div class="sub-card tax copy" data-copy="tax">
        <p>Tax Price</p>
        <h2 id="taxValue">₹0</h2>
        <span class="copied">Copied</span>
      </div>
    </div>
  </div>

  <!-- REVERSE RESULTS -->
  <div class="results hidden" id="resultsReverse">
    <div class="main-card reverse-card">
      <p>X is what % of Y</p>
      <h1 id="reverseValue">0%</h1>
    </div>
  </div>

  <!-- TIP RESULTS -->
  <div class="results hidden" id="resultsTip">
    <div class="row">
      <div class="sub-card tip-card">
        <p>Tip Amount</p>
        <h2 id="tipAmount">₹0</h2>
      </div>
      <div class="sub-card tip-total-card">
        <p>Total Bill</p>
        <h2 id="tipTotal">₹0</h2>
      </div>
    </div>
  </div>

  <!-- HISTORY -->
  <button class="history-btn" id="historyBtn">📜 History</button>

  <div id="historyBox" class="history-box hidden">
    <ul id="historyList"></ul>
    <button class="clear" id="clearHistory">Clear History</button>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
